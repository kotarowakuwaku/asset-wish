name: CI

on:
  pull_request:
  push:
    branches: [main]

# 既定の GITHUB_TOKEN は contents:read のみに絞られている。
# paths-filter は PR の変更ファイル一覧を GitHub API から取るため
# pull-requests:read が無いと "Resource not accessible by integration" で落ちる。
permissions:
  contents: read
  pull-requests: read

# 同じブランチで新しい push が来たら古い実行を止める（無駄なランナー消費を防ぐ）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 変更のあったディレクトリだけ後続ジョブを走らせる。
  # front を触っただけで worker のテストが回るのを防ぐ。
  changes:
    runs-on: ubuntu-latest
    outputs:
      worker: ${{ steps.filter.outputs.worker }}
      front: ${{ steps.filter.outputs.front }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            worker:
              - 'worker/**'
              - 'migrations/**'
              - 'wrangler.jsonc'
              - 'vitest.config.ts'
              - 'tsconfig.json'
              - '.oxlintrc.json'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'
            front:
              - 'front/**'
              - '.github/workflows/ci.yml'

  # 不変条件のうち機械的に検出できるものだけを見る。
  #
  # **paths-filter に掛けず、常に走らせる。** 文書だけの変更でも参照切れは
  # 起きるし、front だけの変更でも front の制約は破れる。数秒で終わるので
  # 無料枠への影響も無い。
  #
  # 判断が要るレビューはここでは行わない（`/architecture-review` の担当）。
  # CI で LLM を回すと従量課金か利用枠の消費が発生し、月額0円の前提が崩れる。
  constraints:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-constraints.sh

  # Cloudflare Workers 側。テストは workerd の中で走るため、Node の API に
  # 依存した実装が紛れ込むとここで落ちる。
  worker:
    needs: changes
    if: needs.changes.outputs.worker == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      # typecheck + oxlint + vitest。ローカルの停止条件と同一のコマンド。
      # typecheck の前に wrangler types が走り、生成物の古さを構造的に潰す。
      - run: npm run check
        env:
          WRANGLER_SEND_METRICS: false

  front:
    needs: changes
    if: needs.changes.outputs.front == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: front/package-lock.json

      - run: npm ci

      # chromium だけ入れる。全ブラウザを入れると遅く、無料枠を無駄に食う。
      # --with-deps は OS 側の共有ライブラリ（libnspr4 等）も入れる。
      # これが無いとブラウザの起動そのものに失敗する。
      - name: install playwright browsers
        run: npx playwright install --with-deps chromium

      # typecheck + oxlint + vitest + playwright。
      # ローカルでエージェントに渡す停止条件と同一のコマンド。
      # CI とローカルで検証内容がずれると「手元では通る」が始まるため、必ず一本にまとめる。
      - run: npm run check

      # 落ちたときに何が起きたかを追えるようにする。trace も含まれる。
      - name: upload playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: front/playwright-report/
          retention-days: 7

  # 全ジョブの結果を集約する。**ブランチ保護が必須にするのはこの ci だけ。**
  #
  # 個別のジョブ名を必須にできないのは、paths-filter で skip されうるため。
  # かといって changes（paths-filter そのもの）を必須にすると、テストが
  # 落ちていてもマージできてしまう（実際に一度この状態になっていた）。
  #
  # **CI にジョブを追加したら、ここの needs にも必ず足すこと。**
  # 忘れるとそのジョブは保護の対象外になり、静かに検証の網から漏れる。
  # 落ちているのに気付けない検証は、無いより悪い。
  # scripts/check-constraints.sh がこの漏れを検出する。
  ci:
    needs: [changes, constraints, worker, front]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 各ジョブの結果を集約する
        env:
          RESULTS: >-
            changes=${{ needs.changes.result }}
            constraints=${{ needs.constraints.result }}
            worker=${{ needs.worker.result }}
            front=${{ needs.front.result }}
        run: |
          echo "$RESULTS" | tr ' ' '\n'
          failed=0
          for entry in $RESULTS; do
            case "${entry#*=}" in
              success|skipped) ;;
              *) echo "::error::${entry%%=*} が通っていない"; failed=1 ;;
            esac
          done
          exit $failed
