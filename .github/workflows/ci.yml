name: CI

on:
  pull_request:
  push:
    branches: [main]

# 既定の GITHUB_TOKEN は contents:read のみに絞られている。
# paths-filter は PR の変更ファイル一覧を GitHub API から取るため
# pull-requests:read が無いと "Resource not accessible by integration" で落ちる。
permissions:
  contents: read
  pull-requests: read

# 同じブランチで新しい push が来たら古い実行を止める（無駄なランナー消費を防ぐ）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 変更のあったディレクトリだけ後続ジョブを走らせる。
  # front を触っただけで worker のテストが回るのを防ぐ。
  changes:
    runs-on: ubuntu-latest
    outputs:
      worker: ${{ steps.filter.outputs.worker }}
      front: ${{ steps.filter.outputs.front }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            worker:
              - 'worker/**'
              - 'migrations/**'
              - 'wrangler.jsonc'
              - 'vitest.config.ts'
              - 'tsconfig.json'
              - '.oxlintrc.json'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'
            front:
              - 'front/**'
              - '.github/workflows/ci.yml'

  # Cloudflare Workers 側。テストは workerd の中で走るため、Node の API に
  # 依存した実装が紛れ込むとここで落ちる。
  worker:
    needs: changes
    if: needs.changes.outputs.worker == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      # typecheck + oxlint + vitest。ローカルの停止条件と同一のコマンド。
      # typecheck の前に wrangler types が走り、生成物の古さを構造的に潰す。
      - run: npm run check
        env:
          WRANGLER_SEND_METRICS: false

  front:
    needs: changes
    if: needs.changes.outputs.front == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: front/package-lock.json

      - run: npm ci

      # chromium だけ入れる。全ブラウザを入れると遅く、無料枠を無駄に食う。
      # --with-deps は OS 側の共有ライブラリ（libnspr4 等）も入れる。
      # これが無いとブラウザの起動そのものに失敗する。
      - name: install playwright browsers
        run: npx playwright install --with-deps chromium

      # typecheck + oxlint + vitest + playwright。
      # ローカルでエージェントに渡す停止条件と同一のコマンド。
      # CI とローカルで検証内容がずれると「手元では通る」が始まるため、必ず一本にまとめる。
      - run: npm run check

      # 落ちたときに何が起きたかを追えるようにする。trace も含まれる。
      - name: upload playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: front/playwright-report/
          retention-days: 7

  # ブランチ保護から参照する集約ジョブ。**必須チェックはこの ci ひとつだけにする。**
  #
  # worker / front は paths フィルタで skip されうるため、個別に必須
  # チェックへ登録すると運用が破綻する。かといって changes だけを必須にすると、
  # テストが落ちていてもマージできてしまう（実際そうなっていた）。
  #
  # ここで結果を一本にまとめる。skip は通過扱い、それ以外の非 success は落とす。
  # 新しいジョブを足したら needs にも必ず追加すること。忘れるとそのジョブは
  # 保護の対象外になり、静かに検証の網から漏れる。
  ci:
    needs: [changes, worker, front]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 各ジョブの結果を集約する
        env:
          RESULTS: >-
            changes=${{ needs.changes.result }}
            worker=${{ needs.worker.result }}
            front=${{ needs.front.result }}
        run: |
          echo "$RESULTS" | tr ' ' '\n'
          failed=0
          for entry in $RESULTS; do
            case "${entry#*=}" in
              success|skipped) ;;
              *) echo "::error::${entry%%=*} が通っていない"; failed=1 ;;
            esac
          done
          exit $failed
