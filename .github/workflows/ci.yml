name: CI

on:
  pull_request:
  push:
    branches: [main]

# 既定の GITHUB_TOKEN は contents:read のみに絞られている。
# paths-filter は PR の変更ファイル一覧を GitHub API から取るため
# pull-requests:read が無いと "Resource not accessible by integration" で落ちる。
permissions:
  contents: read
  pull-requests: read

# 同じブランチで新しい push が来たら古い実行を止める（無駄なランナー消費を防ぐ）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 変更のあったディレクトリだけ後続ジョブを走らせる。
  # front を触っただけで server のテストが回るのを防ぐ。
  changes:
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.filter.outputs.server }}
      front: ${{ steps.filter.outputs.front }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            server:
              - 'server/**'
              - '.github/workflows/ci.yml'
            front:
              - 'front/**'
              - '.github/workflows/ci.yml'
            infra:
              - 'infra/**'

  server:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: gofmt
        run: |
          diff=$(gofmt -l .)
          if [ -n "$diff" ]; then
            echo "gofmt が未適用のファイル:"
            echo "$diff"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # レイヤ境界の検証を含む。domain が外部依存を持った時点でここが落ちる。
      #
      # action は v8 系（golangci-lint v2 対応）を使う。v6 は v1.64 を入れてくるが、
      # v1.64 は go1.24 でビルドされており go.mod の 1.26 を読めずに落ちる。
      # また .golangci.yml は version: "2" 形式なので v1 では解釈できない。
      # バージョンはローカルと揃えて固定する。ここがずれると
      # 「手元では通るのに CI で落ちる」が始まり、ループが信用できなくなる。
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
          working-directory: server

      # 生成コードのコミット漏れ検出。事故が多いので必ず入れる。
      # 段階2で sqlc.yaml を置いた時点で自動的に有効になる。
      # それまで無条件に走らせると設定ファイルが無くて必ず落ち、
      # 検証ゲートが常時赤になってループが機能しなくなる。
      - name: setup sqlc
        if: hashFiles('server/sqlc.yaml', 'server/sqlc.json') != ''
        uses: sqlc-dev/setup-sqlc@v4
        with:
          sqlc-version: '1.27.0'
      - name: sqlc diff
        if: hashFiles('server/sqlc.yaml', 'server/sqlc.json') != ''
        run: sqlc diff

      - name: test
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/test?sslmode=disable
        run: go test -race ./...

  front:
    needs: changes
    if: needs.changes.outputs.front == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: front/package-lock.json

      - run: npm ci

      # 移行期。front はまだ Expo テンプレートのままで、eslint も vitest も入っていない。
      # Vite + React に作り直すまでは型チェックだけを回す。
      - name: tsc（移行期）
        if: hashFiles('front/playwright.config.ts') == ''
        run: npx tsc --noEmit

      # ここから先は playwright.config.ts が置かれた時点で自動的に有効になる。
      # E2E はブラウザを起動するため chromium だけ入れる（全部入れると遅く、無料枠を食う）。
      - name: install playwright browsers
        if: hashFiles('front/playwright.config.ts') != ''
        run: npx playwright install --with-deps chromium

      # tsc + eslint + vitest + playwright。ループの停止条件と同一のコマンド。
      # CI とローカルで検証内容がずれないよう、必ずこれ一本にまとめる。
      - name: check
        if: hashFiles('front/playwright.config.ts') != ''
        run: npm run check

  infra:
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra

    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate
