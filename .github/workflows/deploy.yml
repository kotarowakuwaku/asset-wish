name: Deploy

# main に入ったものだけを本番へ流す。
#
# CI（ci.yml）とは分けてある。CI は PR でも走らせたいが、デプロイは
# main に限りたいため。**CI が緑であることを前提にしている**ので、
# ブランチ保護で ci を必須チェックにしておくこと。
on:
  push:
    branches: [main]
    # ドキュメントだけの変更でデプロイしない。無駄に版が増える。
    paths-ignore:
      - 'docs/**'
      - '**.md'
  # 手動でも流せるようにする。復旧や、paths-ignore で飛ばした分を
  # 意図的に出したいときに使う。
  workflow_dispatch:

permissions:
  contents: read

# デプロイが同時に走ると、あとから始まったほうが古い版を上書きしうる。
# 直列化する。進行中のものは止めない（途中で切ると中途半端に配置される）。
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      # 配置する前に、配置するものが壊れていないことを確かめる。
      # ci.yml と重複するが、ここを省くと「CI を通さずに main へ直 push」で
      # 壊れたものが本番へ出る経路が残る。
      - name: worker のチェック
        run: npm run check
        env:
          WRANGLER_SEND_METRICS: false

      # front のビルド成果物を Worker が配信する。
      # これを忘れると、古い画面が配信され続ける。
      - name: front をビルドする
        run: |
          cd front
          npm ci
          npm run build

      # スキーマを先に当てる。コードが新しいスキーマを前提にしている場合、
      # 順序が逆だと実行時エラーになる。
      #
      # 適用済みのマイグレーションは飛ばされるため、毎回走らせて構わない。
      # 万一のときは D1 の Time Travel（30日）で巻き戻せる。
      - name: D1 のマイグレーションを当てる
        run: npx wrangler d1 migrations apply asset-wish --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: false

      - name: デプロイする
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: false

      # 配置しただけでは動いている保証にならない。実際に叩いて確かめる。
      # AUTH_TOKEN は渡さない。401 が返れば「Worker が生きていて、認証が
      # 効いている」ことまで分かる。200 が返ったら認証が壊れている。
      - name: 動いているか確かめる
        run: |
          url=https://asset-wish.mochiya.workers.dev
          spa=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$url/")
          api=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$url/api/dashboard")
          echo "SPA=$spa API(no auth)=$api"
          [ "$spa" = "200" ] || { echo "::error::SPA が 200 を返さない"; exit 1; }
          [ "$api" = "401" ] || { echo "::error::認証なしの API が 401 を返さない"; exit 1; }
