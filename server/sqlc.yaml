version: "2"

sql:
  - engine: "postgresql"
    # スキーマはマイグレーションから読む。DDL を二重管理しないため。
    # sqlc は goose の "-- +goose Up" を解釈し、Down 側は無視する。
    schema: "db/migrations"
    queries: "db/queries"
    gen:
      go:
        package: "db"
        # depguard（.golangci.yml）が domain からの import を禁じている
        # パスと一致させること。ここを動かすなら depguard も直す。
        out: "internal/db"
        # 詳細設計 4.1 の型変換表が sql.NullTime 前提で書かれているため
        # database/sql を選ぶ。ドライバの実体は pgx/v5 の stdlib を使う。
        sql_package: "database/sql"
        # 生成物は adapter/repository がドメイン型へ詰め替える前提であり、
        # JSON として外に出ることはない（不変条件7）。
        emit_json_tags: false
        emit_prepared_queries: false
        emit_interface: false
        # :many が 0 件のとき nil ではなく空スライスを返す。
        # 呼び出し側で nil 判定を書かずに済む。
        emit_empty_slices: true
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "uuid"
            nullable: true
            go_type: "github.com/google/uuid.NullUUID"
